# The manifest for the "frontend" service.
# Read the full specification for the "Load Balanced Web Service" type at:
#  https://aws.github.io/copilot-cli/docs/manifest/lb-web-service/

# Your service name will be used in naming your resources like log groups, ECS services, etc.
name: frontend
type: Load Balanced Web Service

# Distribute traffic to your service.
http:
  # Requests to this path will be forwarded to your service.
  # To match all requests you can use the "/" path.
  path: '/'
  # You can specify a custom health check path. The default is "/".
  healthcheck:
    path: '/api/health'
    interval: 30s
    timeout: 10s
    healthy_threshold: 2
    unhealthy_threshold: 3
    grace_period: 120s
  deregistration_delay: 5

# Configuration for your containers and service.
image:
  # Docker build arguments. For additional overrides: https://aws.github.io/copilot-cli/docs/manifest/lb-web-service/#image-build
  build:
    dockerfile: frontend/Dockerfile
    args:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsubG9nb3MubG90c3BlY3MuY29tJA
      NEXT_PUBLIC_API_URL: https://api.logos.lotspecs.com
      NEXT_PUBLIC_ENVIRONMENT: production
  # Port exposed through your container to route traffic to it.
  port: 3000

cpu: 512 # Number of CPU units for the task.
memory: 1024 # Amount of memory in MiB used by the task.
count: 1 # Number of tasks that should be running in your service.
exec: true # Enable running commands in your container.
network:
  connect: false # Disable Service Connect - frontend is externally facing via ALB

# storage:
# readonly_fs: true       # Limit to read-only access to mounted root filesystems.

# Environment variables
variables:
  NEXT_PUBLIC_ENVIRONMENT: production
  BACKEND_URL: https://api.logos.lotspecs.com

# You can override any of the values defined above by environment.
environments:
  production:
    secrets:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: 'arn:aws:secretsmanager:us-east-1:260150787661:secret:NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY-Vk07kT'
      NEXT_PUBLIC_API_URL: 'arn:aws:secretsmanager:us-east-1:260150787661:secret:NEXT_PUBLIC_API_URL-FWx7ZJ'
      CLERK_SECRET_KEY: 'arn:aws:secretsmanager:us-east-1:260150787661:secret:CLERK_SECRET_KEY-ieyI6a'
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: 'arn:aws:secretsmanager:us-east-1:260150787661:secret:NEXT_PUBLIC_CLERK_SIGN_IN_URL-npq6Dn'
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: 'arn:aws:secretsmanager:us-east-1:260150787661:secret:NEXT_PUBLIC_CLERK_SIGN_UP_URL-SgNMMY'
      NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: 'arn:aws:secretsmanager:us-east-1:260150787661:secret:NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL-X0IcLh'
      NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: 'arn:aws:secretsmanager:us-east-1:260150787661:secret:NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL-A1Yq7w'
    exec_role_policy:
      Version: '2012-10-17'
      Statement:
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
            - secretsmanager:DescribeSecret
          Resource:
            - 'arn:aws:secretsmanager:us-east-1:260150787661:secret:NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY-*'
            - 'arn:aws:secretsmanager:us-east-1:260150787661:secret:NEXT_PUBLIC_API_URL-*'
            - 'arn:aws:secretsmanager:us-east-1:260150787661:secret:CLERK_SECRET_KEY-*'
            - 'arn:aws:secretsmanager:us-east-1:260150787661:secret:NEXT_PUBLIC_CLERK_SIGN_IN_URL-*'
            - 'arn:aws:secretsmanager:us-east-1:260150787661:secret:NEXT_PUBLIC_CLERK_SIGN_UP_URL-*'
            - 'arn:aws:secretsmanager:us-east-1:260150787661:secret:NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL-*'
            - 'arn:aws:secretsmanager:us-east-1:260150787661:secret:NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL-*'
